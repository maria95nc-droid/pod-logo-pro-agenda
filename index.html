<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f9d6f" />
    <!-- Añadir a pantalla de inicio en iOS (Safari ignora el manifest para esto) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Agenda Podo" />
    <title>Agenda Podológica — Gestión personal de visitas y pacientes</title>
    <meta name="description" content="App privada mobile-first para gestionar visitas, pacientes, material y finanzas del día a día podológico." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Registra el service worker mínimo que permite "Instalar app" en el
      // móvil. Usa la ruta base real (BASE_URL) para que funcione tanto en
      // local (/) como publicado en una subcarpeta (/pod-logo-pro-agenda/).
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          const base = document.querySelector("link[rel='manifest']").getAttribute("href").replace("manifest.webmanifest", "");
          navigator.serviceWorker.register(base + "sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
